<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>APP</title>
  <style>
    :root {
      --bg-app: #f5f6f8;
      --bg-surface: #ffffff;
      --text-primary: #111827;
      --text-secondary: #6b7280;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: var(--bg-app);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      background-color: var(--bg-app);
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.06);
    }

    /* 頂部列 */
    .app-header {
      flex-shrink: 0;
      height: 56px;
      padding: 0 20px;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .app-title {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    /* 空白內容區 */
    .app-main {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .tab-panel {
      display: none;
      flex: 1;
      background-color: var(--bg-surface);
      border: 1px dashed #d1d5db;
      border-radius: 16px;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 14px;
    }

    .tab-panel.is-active {
      display: flex;
    }

    /* 底部五分頁導覽列 */
    .bottom-nav {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background-color: var(--bg-surface);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .nav-btn {
      appearance: none;
      border: 0;
      background: transparent;
      padding: 10px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .nav-btn svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-btn.is-active {
      color: var(--accent);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1 class="app-title" id="headerTitle">首頁</h1>
    </header>

    <main class="app-main">
      <section class="tab-panel" data-panel="ai" aria-label="AI">AI 空白區</section>
      <section class="tab-panel" data-panel="meds" aria-label="藥物">藥物 空白區</section>
      <section class="tab-panel is-active" data-panel="home" aria-label="首頁">首頁 空白區</section>
      <section class="tab-panel" data-panel="family" aria-label="家庭">家庭 空白區</section>
      <section class="tab-panel" data-panel="account" aria-label="帳戶">帳戶 空白區</section>
    </main>

    <nav class="bottom-nav" aria-label="主要導覽">
      <button class="nav-btn" type="button" data-tab="ai" data-title="AI">
        <svg viewBox="0 0 24 24">
          <path d="M12 3l1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8L12 3z" />
          <path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15z" />
        </svg>
        <span>AI</span>
      </button>

      <button class="nav-btn" type="button" data-tab="meds" data-title="藥物">
        <svg viewBox="0 0 24 24">
          <rect x="4" y="10.5" width="16" height="8" rx="4" transform="rotate(-35 12 14.5)" />
          <line x1="9.6" y1="12.9" x2="14.4" y2="16.1" />
        </svg>
        <span>藥物</span>
      </button>

      <button class="nav-btn is-active" type="button" data-tab="home" data-title="首頁">
        <svg viewBox="0 0 24 24">
          <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z" />
        </svg>
        <span>首頁</span>
      </button>

      <button class="nav-btn" type="button" data-tab="family" data-title="家庭">
        <svg viewBox="0 0 24 24">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
        <span>家庭</span>
      </button>

      <button class="nav-btn" type="button" data-tab="account" data-title="帳戶">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 20a8 8 0 0 1 16 0" />
        </svg>
        <span>帳戶</span>
      </button>
    </nav>
  </div>

  <script>
    const buttons = document.querySelectorAll('.nav-btn');
    const panels = document.querySelectorAll('.tab-panel');
    const headerTitle = document.getElementById('headerTitle');

    buttons.forEach((btn) => {
      btn.addEventListener('click', () => {
        const targetTab = btn.dataset.tab;
        const targetTitle = btn.dataset.title;

        buttons.forEach((b) => b.classList.toggle('is-active', b === btn));
        panels.forEach((panel) => {
          panel.classList.toggle('is-active', panel.dataset.panel === targetTab);
        });
        headerTitle.textContent = targetTitle;
        document.title = targetTitle;
      });
    });
  </script>
</body>
</html>
